<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المنشورات التفاعلية</title>
    <style>
        :root { --primary: #22c55e; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 500px; text-align: center; margin-bottom: 25px; border-bottom: 5px solid var(--primary); }
        
        #btn-open-modal { width: 100%; padding: 16px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 18px; transition: 0.3s; }
        #btn-open-modal:disabled { background: #cbd5e1; cursor: not-allowed; }

        .post-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; width: 100%; max-width: 500px; border: 1px solid #e2e8f0; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        .post-card p { font-size: 17px; line-height: 1.6; color: #1e293b; margin-bottom: 10px; }
        .post-footer { font-size: 13px; color: var(--primary); font-weight: bold; border-top: 1px solid #f1f5f9; padding-top: 10px; display: flex; justify-content: space-between; }

        #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        input { padding: 12px; margin: 8px; border: 2px solid #e2e8f0; border-radius: 10px; width: 280px; text-align: center; font-size: 16px; }

        /* نافذة النشر بديلة الـ Prompt */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 450px; }
        textarea { width: 100%; height: 120px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 15px; resize: none; font-size: 16px; outline: none; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2 style="margin-bottom:20px; color:#16a34a">مرحباً بك ✍️</h2>
        <input type="text" id="u-name" placeholder="ادخل اسمك">
        <input type="number" id="u-age" placeholder="ادخل سنك">
        <button id="btn-start" style="padding:12px 50px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer">دخول</button>
    </div>

    <div class="header-card">
        <p id="welcome-msg" style="margin-bottom:10px; color:#64748b; font-weight:500"></p>
        <h1 style="margin-bottom:20px">ساحة المنشورات</h1>
        <button id="btn-open-modal" disabled>جاري تهيئة الاتصال الآمن...</button>
    </div>

    <div id="posts-list" style="width:100%; max-width:500px"></div>

    <div class="modal" id="post-modal">
        <div class="modal-content">
            <h3 style="margin-bottom:15px">اكتب منشورك</h3>
            <textarea id="post-text" placeholder="ماذا يدور في ذهنك؟"></textarea>
            <button id="btn-publish" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer">نشر الآن 🚀</button>
            <button onclick="document.getElementById('post-modal').classList.remove('active')" style="width:100%; margin-top:10px; background:none; border:none; color:#94a3b8; cursor:pointer">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4q0306cgLhI6ebiGOcB-T9Nm5grBL0ck",
            authDomain: "onex-65f46.firebaseapp.com",
            databaseURL: "https://onex-65f46-default-rtdb.firebaseio.com",
            projectId: "onex-65f46",
            storageBucket: "onex-65f46.firebasestorage.app",
            messagingSenderId: "653315530921",
            appId: "1:653315530921:web:ac053628235e7fedb649b8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const postsRef = ref(db, 'posts');

        let userData = JSON.parse(localStorage.getItem('user_v2'));

        if(userData) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('welcome-msg').textContent = `أهلاً بك يا ${userData.name}`;
            signInAnonymously(auth);
        }

        document.getElementById('btn-start').onclick = () => {
            const name = document.getElementById('u-name').value.trim();
            const age = document.getElementById('u-age').value.trim();
            if(name && age) {
                userData = { name, age };
                localStorage.setItem('user_v2', JSON.stringify(userData));
                location.reload();
            }
        };

        // تفعيل الزر فقط عند نجاح الاتصال
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const btn = document.getElementById('btn-open-modal');
                btn.disabled = false;
                btn.textContent = "✍️ اكتب منشوراً جديداً";
            }
        });

        // عرض المنشورات وتجنب الـ undefined
        onValue(postsRef, (snap) => {
            const list = document.getElementById('posts-list');
            list.innerHTML = "";
            if(snap.exists()){
                const posts = [];
                snap.forEach(c => { posts.push(c.val()); });
                posts.reverse().forEach(p => {
                    if(p.text && p.author) {
                        const card = document.createElement('div');
                        card.className = 'post-card';
                        card.innerHTML = `<p>${p.text}</p><div class="post-footer"><span>👤 ${p.author} (${p.age} سنة)</span></div>`;
                        list.appendChild(card);
                    }
                });
            }
        });

        document.getElementById('btn-open-modal').onclick = () => {
            document.getElementById('post-modal').classList.add('active');
        };

        document.getElementById('btn-publish').onclick = async () => {
            const text = document.getElementById('post-text').value.trim();
            if(!text) return;

            const btn = document.getElementById('btn-publish');
            btn.disabled = true;
            btn.textContent = "جاري النشر...";

            try {
                await push(postsRef, {
                    text: text,
                    author: userData.name,
                    age: userData.age,
                    createdAt: serverTimestamp()
                });
                document.getElementById('post-text').value = "";
                document.getElementById('post-modal').classList.remove('active');
            } catch(e) {
                alert("حدث خطأ! تأكد من تفعيل Anonymous Auth في Firebase.");
            } finally {
                btn.disabled = false;
                btn.textContent = "نشر الآن 🚀";
            }
        };
    </script>
</body>
</html>
