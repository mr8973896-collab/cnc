<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المنشورات</title>
    <style>
        :root { --primary: #22c55e; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 600px; }
        .header { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; margin-bottom: 20px; }
        #btn-open-modal { width: 100%; padding: 15px; border: none; border-radius: 12px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        .post-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 25px; border-radius: 20px; }
        textarea { width: 100%; height: 120px; border: 2px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 15px; resize: none; font-size: 16px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #btn-publish { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>📝 ساحة المنشورات</h1>
            <button id="btn-open-modal">✍️ اكتب منشوراً الآن</button>
        </div>
        <div id="posts-list"></div>
    </div>

    <div class="modal" id="post-modal">
        <div class="modal-content">
            <textarea id="post-text" placeholder="اكتب ما يدور في ذهنك..."></textarea>
            <div class="modal-btns">
                <button id="btn-cancel">إلغاء</button>
                <button id="btn-publish">نشر 🚀</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4q0306cgLhI6ebiGOcB-T9Nm5grBL0ck",
            authDomain: "onex-65f46.firebaseapp.com",
            databaseURL: "https://onex-65f46-default-rtdb.firebaseio.com",
            projectId: "onex-65f46",
            storageBucket: "onex-65f46.firebasestorage.app",
            messagingSenderId: "653315530921",
            appId: "1:653315530921:web:ac053628235e7fedb649b8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const postsRef = ref(db, 'posts');

        const btnOpenModal = document.getElementById('btn-open-modal');
        const modal = document.getElementById('post-modal');
        const btnPublish = document.getElementById('btn-publish');
        const btnCancel = document.getElementById('btn-cancel');
        const postText = document.getElementById('post-text');
        const postsList = document.getElementById('posts-list');

        // محاولة تسجيل دخول هادئة مرة واحدة فقط عند التحميل
        signInAnonymously(auth).catch(() => console.log("تحذير: سيتم النشر كضيف بسبب قيود المتصفح."));

        btnOpenModal.onclick = () => modal.classList.add('active');
        btnCancel.onclick = () => { modal.classList.remove('active'); postText.value = ""; };

        btnPublish.onclick = async () => {
            const text = postText.value.trim();
            if (!text) return;

            btnPublish.disabled = true;
            btnPublish.textContent = "جاري النشر...";

            try {
                // النشر مباشرة (بما أن الـ Rules تسمح بـ read: true)
                // ملحوظة: لو الـ write محتاجة auth، والـ auth محظور، 
                // يجب جعل الـ .write: true في Firebase Console لفترة الحظر
                await push(postsRef, {
                    content: text,
                    timestamp: serverTimestamp(),
                    date: new Date().toLocaleString('ar-EG')
                });

                postText.value = "";
                modal.classList.remove('active');
            } catch (err) {
                console.error(err);
                alert("خطأ: يرجى التأكد من إعدادات الـ Rules في Firebase.");
            } finally {
                btnPublish.disabled = false;
                btnPublish.textContent = "نشر 🚀";
            }
        };

        onValue(postsRef, (snapshot) => {
            postsList.innerHTML = "";
            if (snapshot.exists()) {
                const arr = [];
                snapshot.forEach(child => { arr.push(child.val()); });
                arr.reverse().forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `<p>${escapeHTML(post.content)}</p><small style="color:#999">🕒 ${post.date || ''}</small>`;
                    postsList.appendChild(card);
                });
            }
        });

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }
    </script>
</body>
</html>
